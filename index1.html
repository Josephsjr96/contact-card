<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Joe — Contact</title>
<meta name="theme-color" content="#05050a" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&family=JetBrains+Mono:wght@400;700&family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%237c3aed'/><text x='50' y='50' font-family='Inter,sans-serif' font-size='58' font-weight='900' fill='white' text-anchor='middle' dominant-baseline='central'>J</text></svg>" />
<style>
  :root {
    --bg: #05050a;
    --card: rgba(18,18,26,0.7);
    --card-hover: rgba(26,26,36,0.9);
    --border: rgba(255,255,255,0.08);
    --text: #f5f5f7;
    --muted: #8a8a99;
    --wa: #25d366;
    --wa-dark: #128c7e;
    --li: #0a66c2;
    --call: #7c3aed;
    --accent2: #00d4ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 18px;
    overflow-x: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* =========================================================
     BOOT
     ========================================================= */
  #boot {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: radial-gradient(circle at 50% 50%, #141428 0%, #08080f 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: opacity 1.2s ease, visibility 1.2s ease;
  }
  #boot.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  #matrix {
    position: absolute;
    inset: 0;
    z-index: 0;
    opacity: 0.32;
  }

  #boot::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 255, 100, 0.025) 0px,
      rgba(0, 255, 100, 0.025) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 2;
    animation: scanShift 9s linear infinite;
  }
  @keyframes scanShift {
    from { background-position: 0 0; }
    to   { background-position: 0 36px; }
  }

  /* Greetings container — becomes the battle zone */
  #battlefield {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    width: 100%;
    padding: 40px 20px;
  }

  .greeting {
    font-family: "Vazirmatn", "Inter", sans-serif;
    font-weight: 800;
    font-size: clamp(1.6rem, 7vw, 2.6rem);
    letter-spacing: 0.5px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    direction: ltr;
    opacity: 0;
    transform: translateY(14px);
    filter: blur(6px);
    text-shadow: 0 0 22px rgba(124,58,237,0.5);
    white-space: nowrap;
    line-height: 1.4;
    transition: opacity 0.5s ease, transform 0.5s ease, filter 0.5s ease;
    will-change: opacity, transform, filter;
  }
  .greeting.rtl { direction: rtl; }
  .greeting.visible {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
  }
  .greeting.hit {
    opacity: 0 !important;
    transform: scale(1.7) rotate(10deg) !important;
    filter: blur(14px) !important;
    transition: all 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .greeting span {
    opacity: 0;
    transition: opacity 0.4s ease;
    display: inline-block;
  }
  .greeting.visible span { opacity: 1; }

  .g-ar { color: #ffb38a; text-shadow: 0 0 22px rgba(255,154,107,0.55); }
  .g-fa { color: #c4a4ff; text-shadow: 0 0 22px rgba(180,140,255,0.55); }
  .g-en { color: #ffffff; text-shadow: 0 0 22px rgba(255,255,255,0.45); }
  .g-pl { color: #ff8fb0; text-shadow: 0 0 22px rgba(255,107,157,0.55); }
  .g-de { color: #9bf1c8; text-shadow: 0 0 22px rgba(120,255,180,0.55); }

  /* Battle canvas overlay */
  #battle-canvas {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #battle-canvas.show { opacity: 1; }

  /* =========================================================
     PAGE
     ========================================================= */
  .page {
    opacity: 0;
    transition: opacity 1.2s ease 0.2s;
  }
  .page.show { opacity: 1; }

  #galaxy { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 15% 15%, rgba(124,58,237,0.22), transparent 40%),
      radial-gradient(circle at 85% 75%, rgba(0,212,255,0.16), transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(255,51,102,0.08), transparent 55%);
    z-index: 1;
    animation: bgShift 22s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes bgShift {
    0%   { transform: scale(1) rotate(0deg); opacity: 1; }
    100% { transform: scale(1.2) rotate(4deg); opacity: 0.85; }
  }

  .wrap {
    position: relative; z-index: 2;
    width: 100%; max-width: 420px;
    animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hero { text-align: center; margin-bottom: 32px; }
  h1 {
    font-family: "Inter", sans-serif;
    font-size: 2.4rem; font-weight: 900;
    letter-spacing: -1.5px; margin-bottom: 8px;
    color: #fff;
    text-shadow: 0 0 30px rgba(124,58,237,0.5);
  }
  .role {
    font-size: 0.85rem; color: var(--muted);
    letter-spacing: 0.2px; line-height: 1.5; font-weight: 500;
  }
  .role span { color: var(--accent2); font-weight: 600; }

  .loc {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 14px; padding: 5px 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 100px;
    font-size: 0.75rem; color: var(--muted); font-weight: 500;
    backdrop-filter: blur(8px);
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #22c55e; box-shadow: 0 0 8px #22c55e;
    animation: blink2 2s ease-in-out infinite;
  }
  @keyframes blink2 { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .actions { display: flex; flex-direction: column; gap: 12px; }

  .btn {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    text-decoration: none; color: var(--text);
    font-weight: 600; font-size: 0.98rem;
    position: relative; overflow: hidden;
    transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    -webkit-user-select: none; user-select: none;
  }
  .btn:active { transform: scale(0.97); }
  .btn:hover {
    background: var(--card-hover);
    border-color: rgba(255,255,255,0.16);
  }
  .btn .icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 1.25rem; font-weight: 800;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .btn:hover .icon { transform: scale(1.06); }
  .btn .label { flex: 1; text-align: left; }
  .btn .label small {
    display: block; font-weight: 400; font-size: 0.75rem;
    color: var(--muted); margin-top: 2px;
  }
  .btn .arrow {
    color: var(--muted); font-size: 1.1rem;
    transition: transform 0.2s ease;
  }
  .btn:hover .arrow { transform: translateX(4px); color: var(--text); }

  .btn.wa  .icon { background: linear-gradient(135deg, var(--wa), var(--wa-dark)); color: #fff; }
  .btn.li  .icon { background: linear-gradient(135deg, var(--li), #004182); color: #fff; font-size: 1rem; }
  .btn.call .icon { background: linear-gradient(135deg, var(--call), #4c1d95); color: #fff; }
  .btn.gh  .icon { background: linear-gradient(135deg, #333, #111); color: #fff; }

  .btn.wa:hover   { border-color: rgba(37,211,102,0.4); }
  .btn.li:hover   { border-color: rgba(10,102,194,0.4); }
  .btn.call:hover { border-color: rgba(124,58,237,0.4); }
  .btn.gh:hover   { border-color: rgba(255,255,255,0.25); }

  .foot {
    margin-top: 34px; text-align: center;
    font-size: 0.72rem; color: var(--muted);
    letter-spacing: 0.4px; font-weight: 500;
  }
  .foot strong { color: var(--text); font-weight: 600; }

  /* ===== 🍉 Floating easter egg ===== */
  .egg {
    position: fixed;
    bottom: 22px; right: 22px;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem;
    cursor: pointer;
    z-index: 50;
    animation: float 3.5s ease-in-out infinite;
    transition: transform 0.2s ease, background 0.2s ease;
    user-select: none; -webkit-user-select: none;
  }
  .egg:hover { background: rgba(255,255,255,0.14); transform: scale(1.1); }
  .egg:active { transform: scale(0.95); }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50%      { transform: translateY(-8px) rotate(4deg); }
  }
  .egg::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,107,53,0.35), transparent 70%);
    z-index: -1;
    animation: halo 2.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes halo {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50%      { opacity: 0.8; transform: scale(1.15); }
  }

  /* ===== Game panel ===== */
  #game-panel {
    position: fixed; inset: 0;
    z-index: 100;
    background: #05050a;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #game-panel.open { display: flex; opacity: 1; }

  #game-panel .top {
    position: absolute;
    top: 18px; left: 18px; right: 18px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 10;
  }
  .back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 100px;
    color: #fff;
    font-family: inherit; font-size: 0.85rem; font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(12px);
    transition: all 0.2s ease;
  }
  .back-btn:hover { background: rgba(255,255,255,0.15); }
  .score-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 16px;
    background: rgba(255,107,53,0.15);
    border: 1px solid rgba(255,107,53,0.4);
    border-radius: 100px;
    color: #ff6b35;
    font-size: 0.85rem; font-weight: 700;
    backdrop-filter: blur(12px);
  }
  #game-canvas {
    display: block;
    max-width: 100%;
    border-radius: 20px;
    box-shadow: 0 30px 80px -20px rgba(124,58,237,0.6);
    background: radial-gradient(circle at 50% 50%, rgba(124,58,237,0.15), rgba(5,5,10,1) 70%);
    touch-action: none;
    cursor: crosshair;
  }
  .game-hint {
    position: absolute; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    color: var(--muted); font-size: 0.78rem;
    text-align: center;
    padding: 8px 16px;
    background: rgba(0,0,0,0.5);
    border-radius: 100px;
    backdrop-filter: blur(8px);
    white-space: nowrap;
  }

  @media (max-width: 400px) {
    h1 { font-size: 2rem; }
    .btn { padding: 14px 16px; }
    .btn .icon { width: 40px; height: 40px; font-size: 1.15rem; }
    .egg { width: 50px; height: 50px; font-size: 1.6rem; bottom: 18px; right: 18px; }
    .game-hint { font-size: 0.7rem; }
    .greeting { font-size: clamp(1.3rem, 8vw, 1.9rem); }
  }
</style>
</head>

<script>
/* =========================================================
   0. BOOT — greetings, then a rocket blows them all up
   ========================================================= */
(function boot() {
  const bootEl = document.getElementById("boot");
  const pageEl = document.getElementById("page");
  const battleCanvas = document.getElementById("battle-canvas");
  const battleCtx = battleCanvas.getContext("2d");
  const greetingEls = document.querySelectorAll(".greeting");

  /* ---- Matrix rain ---- */
  (function matrix() {
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");
    let W, H, cols, yPos, chars;
    const fontSize = 16;

    function setup() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      cols = Math.floor(W / fontSize);
      yPos = Array(cols).fill(0).map(() => Math.random() * -50);
      chars = "01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン".split("");
    }
    setup();
    window.addEventListener("resize", setup);

    let raf, alive = true;
    function draw() {
      if (!alive) return;
      ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
      ctx.fillRect(0, 0, W, H);
      ctx.font = fontSize + "px monospace";
      for (let i = 0; i < cols; i++) {
        const ch = chars[Math.floor(Math.random() * chars.length)];
        const y = yPos[i] * fontSize;
        ctx.fillStyle = Math.random() < 0.03 ? "#c4a4ff" : "#22ff88";
        ctx.fillText(ch, i * fontSize, y);
        if (y > H && Math.random() > 0.975) yPos[i] = 0;
        yPos[i] += 1;
      }
      raf = requestAnimationFrame(draw);
    }
    draw();
    window.__stopMatrix = () => { alive = false; cancelAnimationFrame(raf); };
  })();

  /* ---- Greetings appear letter by letter (or as whole RTL words) ---- */
  const GREETINGS = [
    { text: "سلام",  split: false },
    { text: "درود",  split: false },
    { text: "Hello", split: true  },
    { text: "Cześć", split: true  },
    { text: "Hallo", split: true  }
  ];

  greetingEls.forEach((el, i) => {
    const g = GREETINGS[i];
    if (g.split) {
      el.innerHTML = "";
      Array.from(g.text).forEach((ch, li) => {
        const span = document.createElement("span");
        span.textContent = ch;
        span.style.transitionDelay = (li * 140) + "ms";
        el.appendChild(span);
      });
    } else {
      el.textContent = g.text;
    }

    setTimeout(() => { el.classList.add("visible"); }, i * 800);
  });

  // After greetings appear → launch rocket
  const battleStart = greetingEls.length * 800 + 1400;
  setTimeout(startBattle, battleStart);

  /* =========================================================
     The rocket: launches from bottom, flies straight up,
     explodes at the middle of the greetings block,
     and they all vanish at once.
     ========================================================= */
  function startBattle() {
    battleCanvas.width = window.innerWidth;
    battleCanvas.height = window.innerHeight;
    battleCanvas.classList.add("show");

    window.addEventListener("resize", () => {
      battleCanvas.width = window.innerWidth;
      battleCanvas.height = window.innerHeight;
    });

    const W = battleCanvas.width;
    const H = battleCanvas.height;

    // Find the center of the greetings block
    const boxes = Array.from(greetingEls).map(el => el.getBoundingClientRect());
    const firstBox = boxes[0];
    const lastBox = boxes[boxes.length - 1];
    const targetY = (firstBox.top + lastBox.bottom) / 2;
    const targetX = W / 2;

    const rocket = {
      x: targetX,
      y: H + 80,
      vy: -10,
      launched: false,
      exploded: false,
      trail: []
    };

    // Launch after a short beat
    setTimeout(() => { rocket.launched = true; }, 500);

    const particles = [];
    const GREETING_COLORS = ["#ffb38a", "#c4a4ff", "#ffffff", "#ff8fb0", "#9bf1c8"];
    const greetingCenters = boxes.map(r => ({
      x: r.left + r.width / 2,
      y: r.top + r.height / 2
    }));

    let done = false;
    let explodeTime = 0;

    function explode() {
      // Big core burst at rocket position
      for (let i = 0; i < 100; i++) {
        const ang = Math.random() * Math.PI * 2;
        const sp = Math.random() * 11 + 2;
        particles.push({
          x: rocket.x, y: rocket.y,
          vx: Math.cos(ang) * sp,
          vy: Math.sin(ang) * sp,
          life: 1100,
          maxLife: 1100,
          size: Math.random() * 4.5 + 1.5,
          color: Math.random() < 0.5 ? "#ffcc44" : "#ff6b35"
        });
      }

      // Each greeting bursts in its own color, at its own position
      greetingCenters.forEach((c, i) => {
        for (let k = 0; k < 30; k++) {
          const ang = Math.random() * Math.PI * 2;
          const sp = Math.random() * 8 + 1.5;
          particles.push({
            x: c.x, y: c.y,
            vx: Math.cos(ang) * sp,
            vy: Math.sin(ang) * sp,
            life: 1000,
            maxLife: 1000,
            size: Math.random() * 4 + 1.5,
            color: GREETING_COLORS[i]
          });
        }
      });

      // All greetings vanish at the same instant
      greetingEls.forEach(el => el.classList.add("hit"));
    }

    let lastTime = performance.now();

    function loop(now) {
      const dt = Math.min((now - lastTime) / 16.67, 3);
      lastTime = now;

      battleCtx.clearRect(0, 0, W, H);

      /* ---- Rocket ---- */
      if (rocket.launched && !rocket.exploded) {
        rocket.y += rocket.vy * dt;

        // Trail
        rocket.trail.push({ x: rocket.x, y: rocket.y, life: 450 });
        for (let i = rocket.trail.length - 1; i >= 0; i--) {
          rocket.trail[i].life -= 16 * dt;
          if (rocket.trail[i].life <= 0) rocket.trail.splice(i, 1);
        }

        // Reached target?
        if (rocket.y <= targetY + 10) {
          rocket.exploded = true;
          explode();
          explodeTime = now;
        }
      }

      // Draw trail
      for (let i = 0; i < rocket.trail.length; i++) {
        const t = rocket.trail[i];
        const a = t.life / 450;
        battleCtx.globalAlpha = a * 0.7;
        battleCtx.fillStyle = "#ffcc44";
        battleCtx.beginPath();
        battleCtx.arc(t.x, t.y, 3 * a + 1, 0, Math.PI * 2);
        battleCtx.fill();
      }
      battleCtx.globalAlpha = 1;

      /* ---- Draw rocket ---- */
      if (rocket.launched && !rocket.exploded) {
        battleCtx.save();
        battleCtx.translate(rocket.x, rocket.y);

        battleCtx.shadowColor = "#00d4ff";
        battleCtx.shadowBlur = 18;

        // Body
        battleCtx.fillStyle = "#e8e8f0";
        battleCtx.beginPath();
        battleCtx.moveTo(0, -22);
        battleCtx.lineTo(-7, -4);
        battleCtx.lineTo(-7, 12);
        battleCtx.lineTo(7, 12);
        battleCtx.lineTo(7, -4);
        battleCtx.closePath();
        battleCtx.fill();

        // Nose
        battleCtx.fillStyle = "#00d4ff";
        battleCtx.beginPath();
        battleCtx.moveTo(0, -22);
        battleCtx.lineTo(-7, -4);
        battleCtx.lineTo(7, -4);
        battleCtx.closePath();
        battleCtx.fill();

        // Window
        battleCtx.fillStyle = "#0a0a18";
        battleCtx.beginPath();
        battleCtx.arc(0, -1, 3, 0, Math.PI * 2);
        battleCtx.fill();

        // Fins
        battleCtx.fillStyle = "#ff6b35";
        battleCtx.beginPath();
        battleCtx.moveTo(-7, 4);
        battleCtx.lineTo(-13, 14);
        battleCtx.lineTo(-7, 12);
        battleCtx.closePath();
        battleCtx.fill();
        battleCtx.beginPath();
        battleCtx.moveTo(7, 4);
        battleCtx.lineTo(13, 14);
        battleCtx.lineTo(7, 12);
        battleCtx.closePath();
        battleCtx.fill();

        // Engine flame
        battleCtx.shadowColor = "#ff6b35";
        battleCtx.shadowBlur = 22;
        battleCtx.fillStyle = "#ff6b35";
        const flame = 14 + Math.random() * 10;
        battleCtx.beginPath();
        battleCtx.moveTo(-5, 12);
        battleCtx.lineTo(0, 12 + flame);
        battleCtx.lineTo(5, 12);
        battleCtx.closePath();
        battleCtx.fill();

        battleCtx.restore();
        battleCtx.shadowBlur = 0;
      }

      /* ---- Particles ---- */
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.vy += 0.13 * dt;
        p.vx *= 0.99;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= 16 * dt;
        if (p.life <= 0) { particles.splice(i, 1); continue; }

        const alpha = p.life / p.maxLife;
        battleCtx.globalAlpha = alpha;
        battleCtx.fillStyle = p.color;
        battleCtx.beginPath();
        battleCtx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
        battleCtx.fill();
      }
      battleCtx.globalAlpha = 1;

      /* ---- Done? ---- */
      if (rocket.exploded && !done && (now - explodeTime) > 1500) {
        done = true;
        bootEl.classList.add("hide");
        if (window.__stopMatrix) window.__stopMatrix();
        pageEl.classList.add("show");
        setTimeout(() => { bootEl.style.display = "none"; }, 1200);
      }

      if (!done) requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  }
})();

/* =========================================================
   1. GALAXY BACKGROUND
   ========================================================= */
(function galaxy() {
  const canvas = document.getElementById("galaxy");
  const ctx = canvas.getContext("2d");
  let W, H, stars = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    stars = [];
    const count = Math.floor((W * H) / 9000);
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.4 + 0.2,
        a: Math.random() * 0.6 + 0.2,
        speed: Math.random() * 0.03 + 0.01,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      const twinkle = 0.5 + 0.5 * Math.sin(t * 0.001 + s.phase);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${s.a * twinkle})`;
      ctx.fill();
      s.y += s.speed;
      if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    }
    requestAnimationFrame(draw);
  }

  resize();
  window.addEventListener("resize", resize);
  requestAnimationFrame(draw);
})();

/* =========================================================
   2. FRUIT SLICE MINI-GAME
   ========================================================= */
let gameRunning = false;
let gameRAF = null;
let gameScore = 0;
let gameLives = 3;
let fruits = [];
let slices = [];
let particles = [];
let lastTime = 0;
let spawnTimer = 0;
let pointerDown = false;
let pointerTrail = [];
let pointerX = 0, pointerY = 0;

const canvas = document.getElementById("game-canvas");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;
const scoreEl = document.getElementById("score");

const FRUITS = [
  { emoji: "🍉", color: "#ff4d6d", radius: 28 },
  { emoji: "🍊", color: "#ffa726", radius: 26 },
  { emoji: "🍎", color: "#ef5350", radius: 26 },
  { emoji: "🍋", color: "#ffeb3b", radius: 24 },
  { emoji: "🥝", color: "#8bc34a", radius: 24 },
  { emoji: "🍇", color: "#9c27b0", radius: 26 }
];

function openGame() {
  document.getElementById("game-panel").classList.add("open");
  document.body.style.overflow = "hidden";
  startGame();
}
function closeGame() {
  document.getElementById("game-panel").classList.remove("open");
  document.body.style.overflow = "";
  stopGame();
}

function startGame() {
  gameScore = 0;
  gameLives = 3;
  fruits = [];
  slices = [];
  particles = [];
  pointerTrail = [];
  spawnTimer = 0;
  scoreEl.textContent = "0";
  gameRunning = true;
  lastTime = performance.now();
  gameRAF = requestAnimationFrame(gameLoop);
}
function stopGame() {
  gameRunning = false;
  if (gameRAF) cancelAnimationFrame(gameRAF);
  gameRAF = null;
}

function spawnFruit() {
  const f = FRUITS[Math.floor(Math.random() * FRUITS.length)];
  const x = 60 + Math.random() * (W - 120);
  const vx = (Math.random() - 0.5) * 2;
  const vy = -(Math.random() * 3 + 9);
  fruits.push({
    x, y: H + 40, vx, vy,
    r: f.radius, emoji: f.emoji, color: f.color,
    rot: 0, rotSpeed: (Math.random() - 0.5) * 0.08
  });
}

function gameLoop(now) {
  if (!gameRunning) return;
  const dt = Math.min(now - lastTime, 40);
  lastTime = now;

  spawnTimer += dt;
  if (spawnTimer > 750) { spawnFruit(); spawnTimer = 0; }

  for (let i = fruits.length - 1; i >= 0; i--) {
    const f = fruits[i];
    f.vy += 0.32;
    f.x += f.vx;
    f.y += f.vy;
    f.rot += f.rotSpeed;
    if (f.y > H + 60) {
      fruits.splice(i, 1);
      gameLives--;
      if (gameLives <= 0) { endGame(); return; }
    }
  }

  for (let i = slices.length - 1; i >= 0; i--) {
    const s = slices[i];
    s.vy += 0.32; s.x += s.vx; s.y += s.vy; s.rot += s.rotSpeed;
    s.life -= dt;
    if (s.life <= 0) slices.splice(i, 1);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vy += 0.25; p.x += p.vx; p.y += p.vy;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (pointerDown) pointerTrail.push({ x: pointerX, y: pointerY, life: 300 });
  for (let i = pointerTrail.length - 1; i >= 0; i--) {
    pointerTrail[i].life -= dt;
    if (pointerTrail[i].life <= 0) pointerTrail.splice(i, 1);
  }

  for (let i = fruits.length - 1; i >= 0; i--) {
    const f = fruits[i];
    for (const pt of pointerTrail) {
      const dx = pt.x - f.x, dy = pt.y - f.y;
      if (dx * dx + dy * dy < (f.r + 14) * (f.r + 14)) {
        sliceFruit(f);
        fruits.splice(i, 1);
        gameScore++;
        scoreEl.textContent = gameScore;
        break;
      }
    }
  }

  drawGame();
  gameRAF = requestAnimationFrame(gameLoop);
}

function sliceFruit(f) {
  for (let s = -1; s <= 1; s += 2) {
    slices.push({
      x: f.x, y: f.y,
      vx: s * 2.5 + f.vx,
      vy: f.vy - 1,
      r: f.r, emoji: f.emoji,
      rot: 0, rotSpeed: s * 0.15,
      life: 900
    });
  }
  for (let i = 0; i < 12; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = Math.random() * 4 + 1;
    particles.push({
      x: f.x, y: f.y,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp,
      color: f.color, life: 600,
      size: Math.random() * 4 + 2
    });
  }
}

function drawGame() {
  ctx.clearRect(0, 0, W, H);

  if (pointerTrail.length > 1) {
    ctx.save();
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (let i = 1; i < pointerTrail.length; i++) {
      const p0 = pointerTrail[i - 1];
      const p1 = pointerTrail[i];
      const alpha = p1.life / 300;
      ctx.strokeStyle = `rgba(0,212,255,${alpha * 0.9})`;
      ctx.lineWidth = 4 + alpha * 6;
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.stroke();
    }
    ctx.restore();
  }

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (const f of fruits) {
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rot);
    ctx.font = `${f.r * 1.8}px serif`;
    ctx.fillText(f.emoji, 0, 0);
    ctx.restore();
  }

  for (const s of slices) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    ctx.globalAlpha = Math.max(0, s.life / 900);
    ctx.font = `${s.r * 1.8}px serif`;
    ctx.fillText(s.emoji, 0, 0);
    ctx.restore();
  }

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 600);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.font = "24px serif";
  ctx.textAlign = "left";
  ctx.fillStyle = "#fff";
  for (let i = 0; i < gameLives; i++) {
    ctx.fillText("❤️", 16 + i * 30, 30);
  }
}

function endGame() {
  stopGame();
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "rgba(5,5,10,0.9)";
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "#fff";
  ctx.font = "900 42px Inter, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Game Over", W / 2, H / 2 - 60);

  ctx.fillStyle = "#ff6b35";
  ctx.font = "800 28px Inter, sans-serif";
  ctx.fillText(`Score: ${gameScore}`, W / 2, H / 2);

  ctx.fillStyle = "#8a8a99";
  ctx.font = "500 16px Inter, sans-serif";
  ctx.fillText("Tap to play again", W / 2, H / 2 + 60);

  canvas.onclick = () => { canvas.onclick = null; startGame(); };
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  const t = e.touches ? e.touches[0] : e;
  pointerX = (t.clientX - rect.left) * scaleX;
  pointerY = (t.clientY - rect.top) * scaleY;
}
canvas.addEventListener("pointerdown", e => { pointerDown = true; getPos(e); pointerTrail = []; });
canvas.addEventListener("pointermove", e => { if (pointerDown) getPos(e); });
canvas.addEventListener("pointerup", () => { pointerDown = false; });
canvas.addEventListener("pointerleave", () => { pointerDown = false; });
</script>
