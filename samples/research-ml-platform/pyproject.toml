[project]
name = "research-ml-platform"
version = "0.1.0"
description = "Canary-deployed MLOps platform for the Persian-German-Polish poetic translation research project"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
