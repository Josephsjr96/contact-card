global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "inference"
    metrics_path: /metrics
    static_configs:
      - targets: ["inference:8002"]

  - job_name: "registry"
    metrics_path: /health
    static_configs:
      - targets: ["registry:8001"]

  - job_name: "research"
    metrics_path: /health
    static_configs:
      - targets: ["research:8003"]

  - job_name: "rollback-worker"
    metrics_path: /health
    static_configs:
      - targets: ["rollback-worker:8004"]
